name: V2 Next.js Build Check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Compile Next.js without media downloads
        run: npx next build
        env:
          MOTORYAT_DATA_SOURCE: demo
          NEXT_TELEMETRY_DISABLED: '1'
